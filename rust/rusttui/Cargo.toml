[package]
name = "rusttui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Full-screen terminal chat for Causewaybay Jarvis."

[[bin]]
name = "rusttui"
path = "src/main.rs"

[dependencies]
rustcore.workspace = true
rustmlx.workspace = true
anyhow.workspace = true

ratatui = "0.30"

clap = { version = "4", features = ["derive"] }
textwrap = "0.16"
unicode-width = "0.2"
