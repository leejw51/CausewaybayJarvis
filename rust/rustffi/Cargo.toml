[package]
name = "rustffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "C ABI for Causewaybay Jarvis: a shared library any language with an FFI can chat through."

[lib]
# The artefact is `libjarvis.dylib`, not `librustffi.dylib` — the crate is the
# packaging, `jarvis` is the thing being linked against.
name = "jarvis"
# cdylib for the shared library the bindings load, staticlib for embedding, and
# rlib so the tests in `tests/` can link the same symbols.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rustcore.workspace = true
rustmlx.workspace = true
# The robot backend, in this library rather than behind a socket: `mlx` because
# a library that already links the engine for its sessions would otherwise
# carry a backend that cannot use it. This is what lets the packaged app be one
# thing — see `src/agent.rs`.
rustagent = { workspace = true, features = ["mlx"] }
anyhow.workspace = true
serde_json.workspace = true

ctrlc = "3"

[dev-dependencies]
# The agent tests open a throwaway space rather than the operator's own.
tempfile = "3"
