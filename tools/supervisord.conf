; The robot backend under Python's supervisord — what `make start` runs and
; `make stop` shuts down. Nothing here is a path on this machine: every value
; is filled in from the environment `make` sets, so the same file serves any
; checkout and any space.
;
;   JARVIS_HOME        the space — ~/.causewaybayjarvis unless overridden
;   JARVIS_ROOT        the repository root, where config.jsonl is looked up
;   JARVIS_SOCK        supervisord's control socket (in the space, or /tmp
;                      when the space's path is too long for AF_UNIX)
;   JARVIS_AGENTD      the binary: agentd-mlx when built, else agentd
;   JARVIS_AGENT_PORT  the fixed port the daemon binds (make start AGENT_PORT=…)
;   JARVIS_BIND        the interface: 127.0.0.1, or 0.0.0.0 for the Wi-Fi
;                      (make start BIND=0.0.0.0)
;
; supervisord's own files sit beside the daemon's agentd.port / agentd.pid /
; agentd.log in the space, so `make clear` never touches them and two spaces
; never share a socket.

[unix_http_server]
file=%(ENV_JARVIS_SOCK)s

[supervisord]
pidfile=%(ENV_JARVIS_HOME)s/supervisord.pid
logfile=%(ENV_JARVIS_HOME)s/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
directory=%(ENV_JARVIS_ROOT)s
identifier=causewaybayjarvis

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_JARVIS_SOCK)s

[program:agentd]
command=%(ENV_JARVIS_AGENTD)s listen --port %(ENV_JARVIS_AGENT_PORT)s --bind %(ENV_JARVIS_BIND)s
directory=%(ENV_JARVIS_ROOT)s
environment=JARVIS_HOME="%(ENV_JARVIS_HOME)s"
autostart=true
; Restart a daemon that crashes, but not one that exited on purpose
; (`daemon.stop` exits 0) — and never retry a start that failed: the one
; way `agentd listen` fails at launch is the port being taken by another
; backend, and retrying would only make the same refusal three times.
autorestart=unexpected
exitcodes=0
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_JARVIS_HOME)s/agentd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
